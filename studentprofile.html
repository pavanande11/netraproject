<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile</title>
</head>
<body style="background: #f3f3ff;padding: 16px;font-family: Arial;color: #1f1f7a;">
    <main>
        <div style="background: linear-gradient(135deg,#4f46e5,#7c3aed);color: white; box-shadow: 0 3px 12px; border-radius: 10px;text-align: center;">
            <h1>Student Profile Page</h1>
        </div>
        <section style="background:white;padding:16px;margin-top:12px; 
          border-radius:16px;box-shadow:0 3px 12px #ddd;text-align: center;">
            <h2>About Me</h2>
            <img src="https://randomuser.me/api/portraits/men/85.jpg" alt="Sorry for inconvience" width="100" height="100" style="border-radius:50%;border: 3px solid blue;">
            <p style="margin: 8px 0 0; font-weight: bold;">Praveeen Prakash | CSE</p>
        </section>
        <section>
            <h2>My Skill</h2>
            <ul>
                <li>HTML</li>
                <li>Python</li>
                <li>C</li>
                <li>MySQL</li>
            </ul>
        </section>
        <section>
            <h2>My Projects</h2>
            <ol>
                <li>Regestration Page</li>
                <li>Library Management Page</li>
                <li>Student Profile Page</li>
            </ol>
        </section>
        <section>
            <h2>Course Registration</h2>
            <form action="" method="get">
                <label for="name">Full Name</label>
                <input type="text" name="name" id="" placeholder="Enter Full Name">

                <label for="email">Email</label>
                <input type="email" name="email" id="" placeholder="Enter Email">
                
                <label for="course">Course</label>
                <select name="course" id="course">
                    <option value="python">Python</option>
                    <option value="java">Java</option>
                    <option value="html">HTML</option>
                </select>

                <p>Learning Mode
                    <label for="online"><input type="radio" name="mode" id="" value="online">Online</label>
                    <label for="offline"><input type="radio" name="mode" id="" value="offline">Offline </label>
                </p>
                <label for="comment">Comments</label>
                <textarea name="comment" id="" cols="30" rows="10"></textarea>
                
                <p>
                    <label for="agree"><input type="checkbox" name="agree" id="">I agree the terms and conditions</label>
                </p>
                <button type="submit">Register</button>
                <button type="reset">ReSet</button>
            </form>
        </section>
    </main>
</body>
</html>
